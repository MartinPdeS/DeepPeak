<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">DeepPeak logo</title>
  <desc id="desc">A coral pulse waveform with a highlighted peak beside the DeepPeak wordmark.</desc>
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4663"/>
      <stop offset="1" stop-color="#ff7a61"/>
    </linearGradient>
  </defs>
  <g transform="translate(18 30)">
    <rect width="220" height="220" rx="48" fill="#29283a"/>
    <path d="M28 167H192" fill="none" stroke="#77758a" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <path d="M28 167C50 167 55 166 68 166C78 166 81 156 88 136C96 111 101 75 111 75C121 75 125 133 134 151C141 165 147 167 158 167H192" fill="none" stroke="url(#pulse)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="111" cy="75" r="9" fill="#fff7f2" stroke="#ff5a62" stroke-width="5"/>
  </g>
  <text x="278" y="159" fill="#29283a" font-family="Inter, Avenir Next, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-4">Deep<tspan fill="#ff5062">Peak</tspan></text>
  <path d="M282 190H850" fill="none" stroke="#ff5062" stroke-width="5" stroke-linecap="round" opacity=".85"/>
</svg>
