[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DeepPeak"
version = "0.5.6"
description = "Peak detection, trace analysis, and dilution-series tooling for 1D signals."
license = { file = "LICENSE" }
readme = "README.rst"
requires-python = ">=3.10"
authors = [{ name = "Martin Poinsinet de Sivry-Houle", email = "martin.poinsinet.de.sivry@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research"
]

keywords = ["peak detection", "signal processing", "dilution series", "deep learning"]

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "MPSPlots",
]

[project.urls]
Homepage = "https://github.com/MartinPdeS/DeepPeak"
Documentation = "https://martinpdes.github.io/DeepPeak/"
Repository = "https://github.com/MartinPdeS/DeepPeak.git"


[tool.setuptools.packages.find]
include = ["DeepPeak", "DeepPeak.*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.h5", "**/*.h5"]

[project.optional-dependencies]
release = ["martinpdes-maintenance==0.2.2"]
ml = [
    "tensorflow>=2.16",
    "scikit-learn>=1.4",
]

testing = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-json-report==1.5.0",
    "coverage>=7.6,<8",
]

documentation = [
    "MartinPdeS-docs>=0.4.0,<0.5",
]

dev = [
    "flake8 ==7.3.0",
    "ruff ==0.11.2",
]

[tool.ruff]
extend-exclude = ["DeepPeak/_version.py"]

[tool.mps-maintenance]
version-file = "DeepPeak/_version.py"
version-method = "literal"
conda-recipe = "conda.recipe/meta.yaml"
citation = "CITATION.cff"
