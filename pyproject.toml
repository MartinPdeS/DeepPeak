[build-system]
requires = ["setuptools>=40.8.0", "wheel", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "DeepPeak"
version = "0.3.0"
description = "Peak detection, trace analysis, and dilution-series tooling for 1D signals."
license = { file = "LICENSE" }
readme = "README.rst"
requires-python = ">=3.10"
authors = [{ name = "Martin Poinsinet de Sivry-Houle", email = "martin.poinsinet.de.sivry@gmail.com" }]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research"
]

keywords = ["peak detection", "signal processing", "dilution series", "deep learning"]

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "MPSPlots",
]

[project.urls]
Homepage = "https://github.com/MartinPdeS/DeepPeak"
Documentation = "https://martinpdes.github.io/DeepPeak/"
Repository = "https://github.com/MartinPdeS/DeepPeak.git"


[tool.setuptools.packages.find]
include = ["DeepPeak", "DeepPeak.*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.h5", "**/*.h5"]

[tool.setuptools_scm]
write_to = "DeepPeak/_version.py"
version_scheme = "only-version"
local_scheme = "no-local-version"



[project.optional-dependencies]
ml = [
    "tensorflow>=2.16",
    "scikit-learn>=1.4",
]

testing = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-json-report==1.5.0",
    "coverage>=7.6,<8",
]

documentation = [
    "numpydoc ==1.10.0",
    "sphinx >=5.1.1",
    "sphinx-rtd-theme ==3.1.0",
    "sphinx-gallery ==0.19.0",
    "pydata-sphinx-theme ==0.16.1",
]

dev = [
    "flake8 ==7.3.0",
    "ruff >=0.6",
]
