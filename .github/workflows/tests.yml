name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[testing]"
      - run: python -c "import DeepPeak; assert 'tensorflow' not in __import__('sys').modules"
      - run: >-
          python -m pytest -q
          --ignore=tests/test_classifiers.py
          --ignore=tests/test_model_evaluation.py
          --ignore=tests/test_model_plotting.py
          --ignore=tests/test_training_config.py

  ml:
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      CUDA_VISIBLE_DEVICES: "-1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build && python -m pip install -e ".[ml,testing]"
      - run: python -m pytest -q --disable-warnings
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -c "import DeepPeak; from DeepPeak.models import WaveNet"
