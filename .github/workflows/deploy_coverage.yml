name: Deploy coverage

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  coverage:
    name: Run tests and generate coverage data
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      CUDA_VISIBLE_DEVICES: "-1"
    steps:
      - name: Set up Python and CI dependencies
        uses: MartinPdeS/MPSActions/actions/setup-python@v2
        with:
          python-version: "3.11"
          install-command: >-
            python -m pip install --upgrade pip wheel build && python -m pip install -e ".[ml,testing]"
          fetch-depth: 0
          submodules: true
      - name: Run tests with coverage
        run: >-
          python -m pytest
          --import-mode=importlib
          --cov=DeepPeak
          --cov-config=.coveragerc
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          tests
          --config-file=pytest.ini
      - name: Post coverage comment
        uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 50
          COVERAGE_PATH: .
