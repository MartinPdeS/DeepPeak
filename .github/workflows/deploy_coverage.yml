name: Deploy coverage

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  coverage:
    name: Run tests and generate coverage data
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      CUDA_VISIBLE_DEVICES: "-1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install package with test and ML dependencies
        run: |
          python -m pip install --upgrade pip wheel build
          python -m pip install -e ".[ml,testing]"
      - name: Run tests with coverage
        run: >-
          python -m pytest
          --import-mode=importlib
          --cov=DeepPeak
          --cov-config=.coveragerc
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          tests
          --config-file=pytest.ini
      - name: Post coverage comment
        uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 50
          COVERAGE_PATH: .
